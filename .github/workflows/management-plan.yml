name: Management tool acceptance
on:
  push:
    branches: [main, 'codex/**']
    paths: ['management-plan-tool/**', '.github/workflows/management-plan.yml']
  pull_request:
    paths: ['management-plan-tool/**', '.github/workflows/management-plan.yml']
permissions:
  contents: read
concurrency:
  group: management-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: management-plan-tool
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: |
          mkdir -p evidence
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee evidence/install.log
      - name: Diff check
        run: git diff --check
      - name: Lint
        if: success()
        run: set -o pipefail; npm run lint 2>&1 | tee evidence/lint.log
      - name: Typecheck
        if: always() && hashFiles('management-plan-tool/node_modules/typescript/package.json') != ''
        run: set -o pipefail; npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Domain acceptance
        if: always() && hashFiles('management-plan-tool/node_modules/vitest/package.json') != ''
        run: set -o pipefail; npm test 2>&1 | tee evidence/domain.log
      - name: Backend and security rules
        if: always() && hashFiles('management-plan-tool/node_modules/firebase-tools/package.json') != ''
        run: set -o pipefail; npm run test:rules 2>&1 | tee evidence/security.log
      - name: Production build
        if: always() && hashFiles('management-plan-tool/node_modules/next/package.json') != ''
        run: set -o pipefail; npm run build 2>&1 | tee evidence/build.log
      - name: Install browser
        if: always() && hashFiles('management-plan-tool/node_modules/@playwright/test/package.json') != ''
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        if: always() && hashFiles('management-plan-tool/node_modules/@playwright/test/package.json') != ''
        run: set -o pipefail; npm run test:e2e 2>&1 | tee evidence/browser.log
      - name: Package source and results
        if: always()
        run: |
          zip -qr ../management-plan-tool-source.zip . -x 'node_modules/*' '.next/*' 'playwright-report/*' 'test-results/*' '*debug.log' '.env.local' || true
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-verification-${{ github.run_id }}
          path: |
            management-plan-tool-source.zip
            management-plan-tool/evidence/
            management-plan-tool/playwright-report/
            management-plan-tool/test-results/
          retention-days: 14
