name: Verify starter templates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - starter: utility-starter
            test_command: npm test
          - starter: data-backed-starter
            test_command: npm run test:rules

    defaults:
      run:
        working-directory: ${{ matrix.starter }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: ${{ matrix.test_command }}
      - run: npm run build
